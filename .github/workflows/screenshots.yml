name: Publish screenshot gallery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot-gallery
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # This starts an isolated disposable PostgreSQL container. The capture
      # uses synthetic data; only the whitelisted gallery is published.
      - run: pnpm screenshots
        env:
          CI: 'true'
      - name: Publish gallery to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/screenshot-site
          publish_branch: gh-pages
