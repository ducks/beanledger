name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Type-check, unit, and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # scripts/run-e2e.js starts the test Postgres with docker compose,
      # waits for it, runs Playwright against a dev server pointed at it,
      # and tears the database down afterwards.
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
