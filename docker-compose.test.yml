services:
  postgres-test:
    image: postgres:16-alpine
    container_name: beanledger_test_db
    environment:
      POSTGRES_USER: beanledger
      POSTGRES_PASSWORD: beanledger
      POSTGRES_DB: beanledger_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
